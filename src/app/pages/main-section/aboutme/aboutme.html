<section class="about-me-section">
  <div class="about-me-container">
    <div class="about-me-img">
      <img src="images/Tobias-Illner.jpg" alt="Porträt von Tobias Illner" />
    </div>

    <div class="about-me-content">
      <p class="about-me-label">{{ 'app.about.who' | translate }}</p>

      <div class="about-me-card">
        <h2>{{ 'app.about.about' | translate }}</h2>

        <p class="about-me-intro">
          {{ 'app.about.info' | translate }}
        </p>

        <div class="about-me-details">
          <div class="about-me-detail">
            <img src="icons/location.svg" alt="" />
            <p>
              {{ 'app.about.from' | translate }}
            </p>
          </div>

          <div class="about-me-detail">
            <img src="icons/mindset.svg" alt="" />
            <p>
              {{ 'app.about.open' | translate }}
            </p>
          </div>

          <div class="about-me-detail">
            <img src="icons/check.svg" alt="" />
            <p>
              {{ 'app.about.problem' | translate }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
