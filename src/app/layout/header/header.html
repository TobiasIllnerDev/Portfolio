<section class="nav-section">
  <div class="nav-div">
    <label for="language-checkbox" class="language-switch">
      <input
        type="checkbox"
        id="language-checkbox"
        role="switch"
        [attr.aria-label]="'app.nav.changeLanguage' | translate"
        [checked]="translate.currentLang() === 'de'"
        (change)="changeLanguage($event)"
      />

      <span class="language-option en">EN</span>
      <span class="language-option de">DE</span>
      <span class="switch-background" aria-hidden="true"></span>
    </label>

    <a routerLink="/" fragment="about-me">{{ 'app.nav.about' | translate }}</a>
    <a routerLink="/" fragment="skills">{{ 'app.nav.skills' | translate }}</a>
    <a routerLink="/" fragment="projects">{{ 'app.nav.projects' | translate }}</a>
  </div>
  <a class="nav-logo" routerLink="/">
    <img class="logo-default" src="icons/Logo-weiß.png" alt="Tobias Illner" />
    <img class="logo-hover" src="icons/Logo-outline.png" alt="" />
  </a>
</section>
